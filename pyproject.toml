[project]
name = "my-dynamixel-arm-sandbox"
version = "0.1.0"
description = "Read-only diagnostics for a five-motor DYNAMIXEL arm"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dynamixel-sdk>=4.0.5,<5",
    "pyserial>=3.5,<4",
    "beartype>=0.22,<0.24",
    "jaxtyping>=0.3,<0.4",
    "numpy>=2,<3",
    "reportlab>=4.4,<5",
    "opencv-contrib-python-headless>=4.10,<5",
    "articulated-filterreg-r3",
]

[project.scripts]
arm-status = "arm_observer.cli:main"
arm-live = "arm_observer.live_http:main"
arm-id3-open = "arm_observer.id3_motion:main"
arm-tag-sheet = "arm_observer.apriltag.cli:main"
arm-pose-fit = "arm_observer.perception.cli:main"

[project.optional-dependencies]
perception-gpu = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "transformers>=4.44,<5",
    "timm>=1,<2",
    "kornia>=0.7,<1",
    "einops>=0.8,<1",
    "huggingface-hub>=0.25,<1",
    "moderngl>=5.12,<6",
    "pyrealsense2>=2.56,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "ty>=0.0.1,<1", "radon>=6,<7", "jsonschema>=4,<5"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "arm_observer"

[tool.uv.workspace]
members = [
    "packages/articulated-filterreg",
]

[tool.uv.sources]
articulated-filterreg-r3 = { workspace = true, editable = true }
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# jaxtyping axis strings are shape specifications, not forward type names.
"src/arm_observer/numerics.py" = ["F821"]

[tool.ty.src]
include = ["src", "scripts"]
# These native-SDK adapters are checked separately in their actual existing environments.
exclude = ["upstream", "skills/imported", "scripts/capture_realsense.py", "scripts/export_rgbd_point_cloud.py"]
